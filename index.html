<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #222;
    font-size: 18px;
    font-weight: 600;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    background: #2563eb;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bot {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bot.typing { color: #888; }
  #input-row {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #222;
    background: #141414;
  }
  #inp {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #e8e8e8;
    font-size: 15px;
    outline: none;
  }
  #inp:focus { border-color: #2563eb; }
  #send {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { background: #333; cursor: not-allowed; }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>
</head>
<body>
  <header>My AI</header>
  <div id="chat"></div>
  <div id="input-row">
    <input id="inp" placeholder="Type..." autocomplete="off" autofocus>
    <button id="send">Send</button>
  </div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const send = document.getElementById('send');

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function sendMsg() {
  const text = inp.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  inp.value = '';
  inp.focus();
  send.disabled = true;

  const typing = addMsg('...', 'bot typing');

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    typing.classList.remove('typing');
    typing.textContent = data.reply || 'Error';
  } catch (e) {
    typing.classList.remove('typing');
    typing.textContent = 'Server error';
  }

  send.disabled = false;
  inp.focus();
}

send.addEventListener('click', sendMsg);
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
});
</script>
</body>
</html>
